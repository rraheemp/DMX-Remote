; DMX Controller - ESP32-C3 + MAX485
[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino
; BLE stack is large - give the app 3 MB of flash (no OTA partition)
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
build_flags =
    ; Route Serial to the C3's native USB port (SuperMini-style boards).
    ; If your board has a separate USB-UART chip (CP2102/CH340), delete these two lines.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
